<!DOCTYPE html> 
<html lang="pt-BR"> 
    <head>
        <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
         <title>MaxLanguage - Editar Lição</title> 
         <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" > 
    </head> 
    <body> 
        <div class="layout"> 
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>MaxLanguage</h2>
                    <p>Painel administrativo</p>
                </div>
                 <nav> <a href="/admin"> Início </a> 
                    <a href="/admin/usuarios"> Usuários </a> 
                    <a href="/admin/idiomas"> Idiomas </a> 
                    <a href="/admin/licoes"> Lições </a> 
                    <a href="/admin/exercicios"> Exercícios </a> 
                </nav> <div class="sidebar-bottom"> 
                    <a href="/logout"> Sair </a> 
                </div> 
            </aside> 
            <main class="main-content"> 
                <header class="topbar"> 
                    <div> 
                        <h1>Editar lição</h1> 
                        <p> Altere as informações da lição. </p> 
                    </div> 
                </header> 
                <section class="form-card"> 
                    <div class="table-header"> 
                        <h2>Dados da lição</h2> 
                        <p> Atualize as informações abaixo. </p> 
                    </div> 
                    <form method="POST"> 
                        <div class="form-group"> 
                            <label for="cod_idioma"> Idioma </label>
                             <select id="cod_idioma" name="cod_idioma" required > 
                                {% for idioma in idiomas %} 
                                <option value="{{ idioma.get_id() }}" 
                                    {% if idioma.get_id()|string == licao.get_cod_idioma()|string %} 
                                        selected 
                                    {% endif %} > 
                                    {{ idioma.get_descricao() }} 
                                </option> 
                                {% endfor %} 
                            </select>
                        </div> 
                        <div class="form-group"> 
                            <label for="total_niveis"> Total de níveis </label> 
                            <input type="number" id="total_niveis" name="total_niveis" min="1" value="{{ licao.get_total_niveis() }}" required > 
                        </div> 
                        <div class="form-actions"> 
                            <a href="/admin/licoes" class="action-button" > Cancelar </a> 
                            <button type="submit" class="primary-button" > Salvar alterações </button> 
                        </div> 
                    </form> 
                </section> 
            </main> 
        </div> 
    </body> 
    </html>
