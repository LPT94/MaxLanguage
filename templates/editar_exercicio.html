<!DOCTYPE html> 
<html lang="pt-BR"> 
    <head>
        <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
         <title>MaxLanguage - Editar Exercício</title> 
         <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" > 
    </head> 
    <body> 
        <div class="layout"> 
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>MaxLanguage</h2>
                    <p>Painel administrativo</p>
                </div>
                 <nav> <a href="/admin"> Início </a> 
                    <a href="/admin/usuarios"> Usuários </a> 
                    <a href="/admin/idiomas"> Idiomas </a> 
                    <a href="/admin/licoes"> Lições </a> 
                    <a href="/admin/exercicios"> Exercícios </a> 
                </nav> <div class="sidebar-bottom"> 
                    <a href="/logout"> Sair </a> 
                </div> 
            </aside> 
            <main class="main-content"> 
                <header class="topbar"> 
                    <div> 
                        <h1>Editar exercício</h1> 
                        <p> Altere as informações do exercício. </p> 
                    </div> 
                </header> 
                <section class="form-card"> 
                    <div class="table-header"> 
                        <h2>Dados do exercício</h2> 
                        <p> Atualize as informações abaixo. </p> 
                    </div> 
                    <form method="POST">
                        <div class="form-group">
                        <label for="cod_licao" class="top_padding_extra"> Lição </label>
                        <select id="cod_licao" name="cod_licao" required>
                            {% for licao in licoes %}
                            <option value="{{ licao.get_id() }}" {% if licao.get_id()|string == exercicio.get_licao()|string %} 
                            selected {% endif %}>
                            {{ licao.get_descricao() }}
                            </option>
                            {% endfor %}
                        </select>
                        </div>
                        <div class="form-group">
                        <label for="nivel"> Nível </label>
                        <input
                            type="number"
                            id="nivel"
                            name="nivel"
                            min="1"
                            max=""
                            value="{{ exercicio.get_nivel() }}"
                            required
                        />
                        </div>
                        <div class="form-group">
                        <label for="descricao"> Descrição </label>
                        <input type="text" id="descricao" name="descricao" value="{{ exercicio.get_descricao() }}" required />
                        </div>
                        <div class="form-group">
                        <label for="a"> Opção A </label>
                        <input type="text" id="a" name="a" value="{{ exercicio.get_op_a() }}" required />
                        </div>
                        <div class="form-group">
                        <label for="b"> Opção B </label>
                        <input type="text" id="b" name="b" value="{{ exercicio.get_op_b() }}" required />
                        </div>
                        <div class="form-group">
                        <label for="c"> Opção C </label>
                        <input type="text" id="c" name="c" value="{{ exercicio.get_op_c() }}" required />
                        </div>
                        <div class="form-group">
                        <label for="d"> Opção D </label>
                        <input type="text" id="d" name="d" value="{{ exercicio.get_op_d() }}" required />
                        </div>
                        <div class="form-group">
                        <label for="opcao_correta" class="top_padding_extra"> Resposta </label>
                        <select id="opcao_correta" name="opcao_correta" required>
                            <option value="{{ exercicio.get_op_correta() }}" selected>{{ exercicio.get_op_correta() }}</option>
                            {% if exercicio.get_op_correta() != 'A' %}
                            <option value="A">A</option>
                            {% endif %}
                            {% if exercicio.get_op_correta() != 'B' %}
                            <option value="B">B</option>
                            {% endif %}
                            {% if exercicio.get_op_correta() != 'C' %}
                            <option value="C">C</option>
                            {% endif %}
                            {% if exercicio.get_op_correta() != 'D' %}
                            <option value="D">D</option>
                            {% endif %}
                        </select>
                        <div class="form-group">
                        <label for="pontuacao"> Pontuação </label>
                        <input
                            type="number"
                            id="pontuacao"
                            name="pontuacao"
                            min="1"
                            max=""
                            value="{{ exercicio.get_pontuacao() }}"
                            required
                        />
                        </div>
                        <div class="form-actions">
                        <a href="/admin/exercicios" class="action-button"> Cancelar </a>
                        <button type="submit" class="primary-button">
                            Salvar alterações
                        </button>
                        </div>
                    </form>
                </section> 
            </main> 
        </div> 
    </body> 
    </html>
