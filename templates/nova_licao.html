<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaxLanguage - Nova Lição</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="logo">MaxLanguage</div>
        <nav>
          <a href="/admin"> Início </a>
          <a href="/admin/usuarios"> Usuários </a>
          <a href="/admin/idiomas"> Idiomas </a>
          <a href="/admin/licoes"> Lições </a>
          <a href="/admin/exercicios"> Exercícios </a>
        </nav>
        <div class="sidebar-bottom">
          <a href="/logout"> Sair </a>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div>
            <h1>Nova lição</h1>
            <p>Cadastre uma nova lição na plataforma.</p>
          </div>
        </header>
        <section class="form-card">
          <div class="table-header">
            <h2>Dados da lição</h2>
            <p>Preencha as informações abaixo.</p>
          </div>
          <form method="POST">
            <div class="form-group">
              <label for="cod_idioma" class="top_padding_extra"> Idioma </label>
              <select id="cod_idioma" name="cod_idioma" required>
                <option value="" disabled selected>Selecione um idioma</option>
                {% for idioma in idiomas %}
                <option value="{{ idioma.get_id() }}">
                  {{ idioma.get_descricao() }}
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label for="total_niveis"> Total de níveis </label>
              <input
                type="number"
                id="total_niveis"
                name="total_niveis"
                min="1"
                required
              />
            </div>
            <div class="form-group">
              <label for="descricao"> Descrição </label>
              <input type="text" id="descricao" name="descricao" required />
            </div>
            <div class="form-actions">
              <a href="/admin/licoes" class="action-button"> Cancelar </a>
              <button type="submit" class="primary-button">
                Cadastrar lição
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
