<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaxLanguage - Novo Usuário</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/style.css') }}"
    />
  </head>
  <body>
    <div class="layout">
      <aside class="sidebar">
        <div class="logo">MaxLanguage</div>
        <nav>
          <a href="/admin"> Início </a>
          <a href="/admin/usuarios"> Usuários </a>
          <a href="/admin/idiomas"> Idiomas </a>
          <a href="/admin/licoes"> Lições </a>
          <a href="/admin/exercicios"> Exercícios </a>
        </nav>
        <div class="sidebar-bottom">
          <a href="/logout"> Sair </a>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div>
            <h1>Novo Usuário</h1>
            <p>Cadastre um novo usuário na plataforma.</p>
          </div>
        </header>
        <section class="form-card">
          <div class="table-header">
            <h2>Dados do Usuário</h2>
            <p>Preencha as informações abaixo.</p>
          </div>
          <form method="POST">
            <div class="form-group">
              <label for="cod_idioma" class="top_padding_extra"> Idioma </label>
              <select id="cod_idioma" name="cod_idioma" required>
                <option value="" disabled selected>Selecione um Idioma</option>
                {% for idioma in idiomas %}
                <option value="{{ idioma.get_id() }}">
                  {{ idioma.get_descricao() }}
                </option>
                {% endfor %}
              </select>
            </div>
            <div class="form-group">
              <label for="nome"> Nome </label>
              <input type="text" id="nome" name="nome" required />
            </div>
            <div class="form-group">
              <label for="login"> Login </label>
              <input type="text" id="login" name="login" required />
            </div>
            <div class="form-group">
              <label for="senha"> Senha </label>
              <input type="password" id="senha" name="senha" required />
            </div>
            <div class="form-group">
              <label for="nivel_atual"> Nível </label>
              <input
                type="number"
                id="nivel_atual"
                name="nivel_atual"
                min="1"
                max=""
                required
              />
            </div>
            <div class="form-group">
              <label for="pontuacao"> Pontuação </label>
              <input
                type="number"
                id="pontuacao"
                name="pontuacao"
                min="0"
                max=""
                required
              />
            </div>
            <div class="form-group">
              <label for="tipo" class="top_padding_extra"> Resposta </label>
              <select id="tipo" name="tipo" required>
                <option value="" disabled selected>Selecione um tipo</option>
                <option value="0">Administrador</option>
                <option value="1">Usuário</option>
              </select>
            </div>
            <div class="form-actions">
              <a href="/admin/usuarios" class="action-button"> Cancelar </a>
              <button type="submit" class="primary-button">
                Cadastrar Usuário
              </button>
            </div>
          </form>
        </section>
      </main>
    </div>
  </body>
</html>
