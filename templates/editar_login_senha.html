<!DOCTYPE html> 
<html lang="pt-BR"> 
    <head>
        <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
         <title>MaxLanguage - Editar Usuário</title> 
         <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" > 
    </head> 
    <body> 
        <div class="layout"> 
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>MaxLanguage</h2>
                    <p>Painel administrativo</p>
                </div>
                 <nav> <a href="/admin"> Início </a> 
                    <a href="/admin/usuarios"> Usuários </a> 
                    <a href="/admin/idiomas"> Idiomas </a> 
                    <a href="/admin/licoes"> Lições </a> 
                    <a href="/admin/exercicios"> Exercícios </a> 
                </nav> <div class="sidebar-bottom"> 
                    <a href="/logout"> Sair </a> 
                </div> 
            </aside> 
            <main class="main-content"> 
                <header class="topbar"> 
                    <div> 
                        <h1>Editar Usuário</h1> 
                        <p> Altere as informações do Usuário. </p> 
                    </div> 
                </header> 
                <section class="form-card"> 
                    <div class="table-header"> 
                        <h2>Dados do Usuário</h2> 
                        <p> Atualize as informações abaixo. </p> 
                    </div> 
                    <form method="POST">
                        <div class="form-group">
                        <label for="nome"> Nome </label>
                        <input type="text" id="nome" name="nome" value="{{ usuario.get_nome() }}" required />
                        </div>
                        <div class="form-group">
                        <div class="form-group">
                            <label for="login"> Novo Login </label>
                            <input type="text" id="login" name="login"  value="{{ usuario.get_login() }}" required />
                        </div>
                        <div class="form-group">
                            <label for="senha"> Nova senha </label>
                            <input type="password" id="senha" name="senha" required />
                        </div>
                        <div class="form-actions">
                        <a href="/admin/usuarios" class="action-button"> Cancelar </a>
                        <button type="submit" class="primary-button">
                            Salvar alterações
                        </button>
                        </div>
                    </form>
                </section> 
            </main> 
        </div> 
    </body> 
    </html>
