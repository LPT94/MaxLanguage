<!DOCTYPE html> 
<html lang="pt-BR"> 
    <head>
        <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
         <title>MaxLanguage - Editar Usuário</title> 
         <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" > 
    </head> 
    <body> 
        <div class="layout"> 
            <aside class="sidebar">
                <div class="sidebar-header">
                    <h2>MaxLanguage</h2>
                    <p>Painel administrativo</p>
                </div>
                 <nav> <a href="/admin"> Início </a> 
                    <a href="/admin/usuarios"> Usuários </a> 
                    <a href="/admin/idiomas"> Idiomas </a> 
                    <a href="/admin/licoes"> Lições </a> 
                    <a href="/admin/exercicios"> Exercícios </a> 
                </nav> <div class="sidebar-bottom"> 
                    <a href="/logout"> Sair </a> 
                </div> 
            </aside> 
            <main class="main-content"> 
                <header class="topbar"> 
                    <div> 
                        <h1>Editar Usuário</h1> 
                        <p> Altere as informações do Usuário. </p> 
                    </div> 
                </header> 
                <section class="form-card"> 
                    <div class="table-header"> 
                        <h2>Dados do Usuário</h2> 
                        <p> Atualize as informações abaixo. </p> 
                    </div> 
                    <form method="POST">
                        <div class="form-group">
                        <label for="cod_idioma" class="top_padding_extra"> Idioma </label>
                        <select id="cod_idioma" name="cod_idioma" required>
                            {% for idioma in idiomas %}
                            <option value="{{ idioma.get_id() }}" {% if idioma.get_id()|string == usuario.get_cod_idioma()|string %} 
                            selected {% endif %}>
                            {{ idioma.get_descricao() }}
                            </option>
                            {% endfor %}
                        </select>
                        </div>
                        <div class="form-group">
                        <label for="nome"> Nome </label>
                        <input type="text" id="nome" name="nome" value="usuario.get_nome()" required />
                        </div>
                        <div class="form-group">
                        <label for="login"> Novo Login </label>
                        <input type="text" id="login" name="login"  value="usuario.get_nome()" required />
                        </div>
                        <div class="form-group">
                        <label for="senha"> Nova senha </label>
                        <input type="password" id="senha" name="senha" required />
                        </div>
                        <div class="form-group">
                        <label for="nivel_atual"> Nível </label>
                        <input
                            type="number"
                            id="nivel_atual"
                            name="nivel_atual"
                            min="1"
                            max=""
                            value="usuario.get_nivel_atual()"
                            required
                        />
                        </div>
                        <div class="form-group">
                        <label for="pontuacao"> Pontuação </label>
                        <input
                            type="number"
                            id="pontuacao"
                            name="pontuacao"
                            min="0"
                            max=""
                            value="usuario.get_pontuacao()"
                            required
                        />
                        </div>
                        <div class="form-group">
                        <label for="tipo" class="top_padding_extra"> Resposta </label>
                        <select id="tipo" name="tipo" required>
                            <option value="" disabled selected>Selecione um tipo</option>
                            <option value="0">Administrador</option>
                            <option value="1">Usuário</option>
                        </select>
                        </div>
                        <div class="form-actions">
                        <a href="/admin/exercicios" class="action-button"> Cancelar </a>
                        <button type="submit" class="primary-button">
                            Cadastrar Exercício
                        </button>
                        </div>
                    </form>
                </section> 
            </main> 
        </div> 
    </body> 
    </html>
